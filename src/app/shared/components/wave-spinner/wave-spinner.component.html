@if (isLoading()) {
  <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 font-mono">
    <div class="bg-[#132036] border border-[#21324d] rounded-2xl p-5 shadow-2xl flex items-center gap-4 text-white">
      <!-- Spinner retro/clásico con bordes sólidos do tema -->
      <div class="w-6 h-6 border-2 border-[#21324d] border-t-cyan-400 rounded-full animate-spin"></div>
      
      <span class="text-xs uppercase tracking-widest text-[#94a3b8] font-bold">
        CARGANDO...
      </span>
    </div>
  </div>
}
