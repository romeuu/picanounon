<!-- Pe de páxina Minimalista Estilo Consola -->
<footer
  class="mt-12 pt-6 pb-8 border-t border-[#21324d] flex flex-col sm:flex-row justify-between items-center gap-4 text-xs font-mono text-[#94a3b8]"
>
  <div>
    <span class="font-bold text-white tracking-wider">PICANOUNON</span>
  </div>

  <button
    type="button"
    (click)="isModalOpen.set(true)"
    class="px-3 py-1.5 rounded-xl border border-[#21324d] bg-[#132036] text-[#94a3b8] hover:border-[#334b73] hover:text-white transition-colors cursor-pointer text-[11px] tracking-wider uppercase font-semibold"
  >
    [ ℹ️ ATRIBUCIÓN E CRÉDITOS DE ICONOS ]
  </button>
</footer>

<!-- Modal de Atribución mediante app-ui-modal -->
<app-ui-modal
  [isOpen]="isModalOpen()"
  title="ATRIBUCIÓN DE ICONOGRAFÍA"
  maxWidth="md"
  (closed)="isModalOpen.set(false)"
>
  <p class="text-xs text-[#94a3b8] leading-relaxed">
    Os iconos utilizados nesta aplicación foron creados por artistas de
    <a
      href="https://thenounproject.com"
      target="_blank"
      rel="noopener"
      class="text-orange underline font-bold"
      >Noun Project</a
    >
    e distribúense baixo a licenza
    <strong class="text-white">Creative Commons CC BY 3.0</strong>:
  </p>

  <div class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
    @for (item of credits; track item.name) {
      <div
        class="p-2.5 rounded-xl bg-[#060d1b]/60 border border-[#21324d] flex justify-between items-center text-xs font-mono"
      >
        <div>
          <div class="font-bold text-white">{{ item.name }}</div>
          <div class="text-[11px] text-[#94a3b8]">Por {{ item.author }}</div>
        </div>
        <img
          [src]="'assets/' + item.file"
          [alt]="item.name"
          class="w-7 h-7 filter invert opacity-80 object-contain"
        />
      </div>
    }
  </div>

  <div modal-footer class="text-[11px] text-[#94a3b8] text-center font-mono">
    Deseñado con 💙 para a comunidade de pesca en Galicia.
  </div>
</app-ui-modal>
