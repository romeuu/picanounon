<app-ui-card [title]="'TEMPERATURA ACTUAL'">
  <div class="grid grid-cols-[auto_1fr] gap-x-5 gap-y-6 items-center my-auto py-2">
    <!-- Fila 1: Temperatura do Aire -->
    <div class="flex items-center justify-center">
      <img
        src="assets/prevision-tiempo.svg"
        alt="Temperatura Aire"
        class="w-10 h-10 object-contain filter invert brightness-200 opacity-90"
      />
    </div>
    <div>
      <h3 class="text-orange text-xs font-bold uppercase tracking-wider">
        AIRE
      </h3>
      <p class="text-white text-xl font-bold mt-1">
        {{ forecast()?.temperature ?? '--' }} °C
      </p>
    </div>

    <!-- Fila 2: Temperatura da Auga -->
    <div class="flex items-center justify-center">
      <img
        src="assets/temperatura-agua.svg"
        alt="Temperatura Auga"
        class="w-10 h-10 object-contain filter invert brightness-200 opacity-90"
      />
    </div>
    <div>
      <h3 class="text-orange text-xs font-bold uppercase tracking-wider">
        AUGA
      </h3>
      <p class="text-white text-xl font-bold mt-1">
        {{ forecast()?.seaTemperature ?? '--' }} °C
      </p>
    </div>
  </div>
</app-ui-card>
